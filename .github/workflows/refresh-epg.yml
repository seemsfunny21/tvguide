name: Refresh television schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - scripts/refresh_epg.py
      - .github/workflows/refresh-epg.yml
permissions:
  contents: write
concurrency:
  group: tvguide-epg
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and validate XMLTV schedule
        run: python3 scripts/refresh_epg.py
      - name: Commit validated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh validated television schedule"
          git pull --rebase origin main
          git push origin HEAD:main
