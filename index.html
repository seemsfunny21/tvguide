main{max-width:1320px}

<script>
'use strict';
const $=id=>document.getElementById(id), TZ='Europe/Athens', defaultFeed='https://ext.greektv.app/epg/epg.xml';
let data=null, metadata=new Map(), busy=false, generation=0, lastAttempt=0, loadWarning='', lastToday=dateKeySafe();
function dateKeySafe(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Athens',year:'numeric',month:'2-digit',day:'2-digit'}).format(Date.now());}
const dateFmt=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}); const dateKey=d=>{const p=Object.fromEntries(dateFmt.formatToParts(d).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day};
const clock=d=>new Intl.DateTimeFormat('el-GR',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(d);
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function parseTime(s){const m=/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4}|Z)?$/.exec(s||'');if(!m)return NaN;const z=m[7]||'Z';return Date.parse(m[1]+'-'+m[2]+'-'+m[3]+'T'+m[4]+':'+m[5]+':'+(m[6]||'00')+(z==='Z'?z:z.slice(0,3)+':'+z.slice(3)))}
function parse(xml){const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror')||doc.documentElement.localName!=='tv')throw Error('Μη έγκυρο XMLTV');const channels={};for(const c of doc.querySelectorAll('channel')){const id=c.getAttribute('id');if(id)channels[id]=c.querySelector('display-name')?.textContent.trim()||id}const rows=[];for(const p of doc.querySelectorAll('programme')){const start=parseTime(p.getAttribute('start')),stop=parseTime(p.getAttribute('stop')),title=p.querySelector('title')?.textContent.trim(),ch=p.getAttribute('channel');if(!title||!channels[ch]||!Number.isFinite(start)||!Number.isFinite(stop)||stop<=start)continue;const categories=[...p.querySelectorAll('category')].map(x=>x.textContent.trim());const desc=p.querySelector('desc')?.textContent.trim()||'';const date=p.querySelector('date')?.textContent.trim()||'';const year=/^(19\d{2}|20\d{2})/.exec(date)?.[0]||/\((19\d{2}|20\d{2})\)/.exec(title)?.[1]||'';rows.push({ch,start,stop,title,categories,desc,year})}if(!rows.length)throw Error('Δεν βρέθηκαν έγκυρες εκπομπές');return {channels,rows:rows.sort((a,b)=>a.start-b.start)}}
function initData(value,source,at){data={...value,source,at};loadWarning='';metadata.clear();generation++;render();loadMovieMetadata(generation)}
function validSnapshot(snapshot,now){return !!(snapshot&&snapshot.channels&&typeof snapshot.channels==='object'&&Array.isArray(snapshot.rows)&&Number.isFinite(snapshot.at)&&snapshot.at<=now+300000&&now-snapshot.at<=24*3600000&&new Set(snapshot.rows.filter(r=>r&&typeof r.title==='string'&&snapshot.channels[r.ch]&&Number.isFinite(r.start)&&Number.isFinite(r.stop)&&r.start<=now&&now<r.stop).map(r=>snapshot.channels[r.ch])).size>=4);}
function selected(){if(!data)return [];const d=$('day').value;return data.rows.filter(r=>dateKey(r.start)===d||dateKey(r.stop-1)===d)}
function cleanTitle(t){return t.replace(/^\s*\[(?:K|Κ)[^\]]*\]\s*/i,'').replace(/\s*[-–—]\s*(?:Ελληνική|Ξένη)\s+Ταινία\s*$/i,'').trim()}
function isExplicitMovie(r){return (r.categories||[]).some(c=>/ταινία|ταινίες|κινηματογρ|\bmovies?\b|\bfilms?\b/i.test(c))||/\b(?:Ελληνική|Ξένη)\s+Ταινία/i.test(r.title)||/ταινία\s*$/i.test(r.title)}
function movieQuery(r){const t=cleanTitle(r.title);return (/\(([A-Za-z][^()]*[A-Za-z0-9])\)\s*$/.exec(t)?.[1]||t).replace(/\s*\(\d{4}\)\s*$/,'').trim()}
function isCandidate(r){return isExplicitMovie(r)||((r.stop-r.start)>=75*60000&&/\([A-Za-z][^()]+\)\s*$/.test(cleanTitle(r.title)))}
function isMovie(r){return isExplicitMovie(r)||metadata.has(r.title+'|'+r.year)}
async function loadMovieMetadata(expected){
 try{
 const response=await fetch('./data/movies.json',{cache:'no-store',signal:AbortSignal.timeout(8000)});
 if(!response.ok)return;
 const payload=await response.json();
 if(expected!==generation||!Number.isFinite(payload.at)||Date.now()-payload.at>7*86400000||payload.at>Date.now()+300000||!payload.movies||typeof payload.movies!=='object')return;

 if(!keys.has(key)||!Number.isInteger(m?.id)||m.id<=0||!Number.isFinite(m.vote_average)||m.vote_average<0||m.vote_average>10||!Number.isInteger(m.vote_count)||m.vote_count<0)continue;
 next.set(key,{...m,trailer:/^[A-Za-z0-9_-]{11}$/.test(m.trailer||'')?m.trailer:null});
 }

 }catch{}
}
function showProgram(parent,r,now){const line=el('div',clock(r.start)+' – '+clock(r.stop)+'  '+r.title,'card');if(r.start<=now&&now<r.stop){line.classList.add('is-live');line.append(el('div','● Παίζει τώρα','muted'));const bar=el('div',undefined,'bar'),fill=el('span');fill.style.width=(100*(now-r.start)/(r.stop-r.start))+'%';bar.append(fill);line.append(bar)}parent.append(line)}
function render(){const g=$('guide'),m=$('movies'),now=Date.now(),today=dateKey(now)===$('day').value;$('channelsPanel').hidden=!today;const expanded=new Set([...g.querySelectorAll('details[open]')].map(x=>x.dataset.channel));g.replaceChildren();m.replaceChildren();if(!data){g.append(el('p','Δεν υπάρχει διαθέσιμο επαληθευμένο πρόγραμμα.','warn channel-empty'));$('movieStatus').textContent='Χωρίς δεδομένα προγράμματος.';return}
const rows=selected(),fresh=data.rows.some(r=>r.start<=now&&now<r.stop);
$('status').textContent=today?(fresh?loadWarning:'Το διαθέσιμο πρόγραμμα δεν έχει τρέχουσα καταχώριση.'):(!rows.length?'Δεν υπάρχει διαθέσιμο πρόγραμμα για αυτή την ημερομηνία.':loadWarning);$('status').title='Πηγή: '+data.source+' · Ενημέρωση: '+new Date(data.at).toLocaleString('el-GR',{timeZone:TZ});$('channelsPanel').title=$('status').title;
if(!rows.length)g.append(el('p','Δεν υπάρχουν στοιχεία για την επιλεγμένη ημέρα.','warn channel-empty'));
if(today){const grouped=new Map();for(const r of rows){if(!grouped.has(r.ch))grouped.set(r.ch,[]);grouped.get(r.ch).push(r)}

async function load(force=false){
if(busy)return;if(!force&&Date.now()-lastAttempt<300000)return;busy=true;lastAttempt=Date.now();const candidates=[defaultFeed,'https://iptv-epg.org/files/epg-gr.xml','https://www.open-epg.com/files/greece.xml'];const errors=[];
try{
$('status').textContent='Ενημέρωση τηλεοπτικού προγράμματος…';
const endpoints=['./data/schedule.json','https://raw.githubusercontent.com/seemsfunny21/tvguide/main/data/schedule.json'];
const snapshots=await Promise.all(endpoints.map(async endpoint=>{try{
 const resp=await fetch(endpoint,{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!resp.ok)throw Error('HTTP '+resp.status);
 const snapshot=await resp.json();if(!validSnapshot(snapshot,Date.now()))throw Error('Μη πρόσφατο ή ελλιπές πρόγραμμα');return snapshot;
}catch(e){errors.push('Αυτόματη ενημέρωση: '+e.message);return null;}}));
const best=snapshots.filter(Boolean).sort((a,b)=>b.at-a.at)[0];
if(best){
 if(!validSnapshot(data,Date.now())||best.at>=data.at){initData({channels:best.channels,rows:best.rows},best.source||'EPG',best.at);store.set('tvguide-cache',JSON.stringify(data));}
 else{loadWarning='';render();}
 return;
}
for(const candidate of candidates){try{const u=new URL(candidate);if(u.protocol!=='https:')throw Error('Απαιτείται HTTPS');const resp=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!resp.ok)throw Error('HTTP '+resp.status);const value=parse(await resp.text());const now=Date.now();if(!value.rows.some(r=>r.start<=now&&now<r.stop))throw Error('Δεν υπάρχει τρέχον πρόγραμμα');initData(value,candidate,now);store.set('tvguide-cache',JSON.stringify(data));return;}catch(e){errors.push(new URL(candidate,location.href).hostname+': '+e.message)}}
loadWarning=data?'Προσωρινά χωρίς νέα ενημέρωση · Αποθηκευμένο πρόγραμμα':'Δεν ήταν δυνατή η ενημέρωση του προγράμματος.';render();$('status').textContent=loadWarning;$('status').title=errors.join(' · ');

}finally{busy=false}}
function move(delta){const d=new Date($('day').value+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+delta);$('day').value=dateKey(d);render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{$('day').value=dateKey(Date.now());render()};$('day').onchange=render;$('refresh').onclick=()=>load(true);
$('day').value=dateKey(Date.now());try{const cached=JSON.parse(store.get('tvguide-cache'));if(cached?.rows?.length)initData(cached,cached.source,cached.at)}catch{}render();load();
function clockTick(){const today=dateKey(Date.now());if(today!==lastToday){if($('day').value===lastToday)$('day').value=today;lastToday=today;load(true);}render();}
lastToday=dateKey(Date.now());setInterval(clockTick,60000);setInterval(()=>load(),15*60000);
